name: CI pipeline

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run tests
        run: pytest

      - name: Build Artifact
        run: |
          mkdir build
          cp app1.py requirements.txt build/
          tar -czf app.tar.gz build/

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-artifact
          path: app.tar.gz

  deploy-dev:
    runs-on: ubuntu-latest
    needs: build
    environment: dev

    steps:
      - name: Download Artifact
        uses: actions/download-artifact@v4
        with:
          name: app-artifact

      - name: Extract Artifact
        run: |
          tar -xzf app.tar.gz
          ls -R

      - name: Verify deployed code (DEV)
        run: |
          python - <<EOF
          from build.app1 import add
          print("DEV verification (5+3):", add(5, 3))
          print("DEV verification (-2+-4):", add(-2, -4))
          EOF

  deploy-prod:
    runs-on: ubuntu-latest
    needs: deploy-dev
    environment: prod

    steps:
      - name: Download Artifact
        uses: actions/download-artifact@v4
        with:
          name: app-artifact

      - name: Extract Artifact
        run: |
          tar -xzf app.tar.gz
          ls -R

      - name: Verify deployed code (PROD)
        run: |
          python - <<EOF
          from build.app1 import add
          print("PROD verification (10+20):", add(10, 20))
          print("PROD verification (-5+-7):", add(-5, -7))
          EOF
